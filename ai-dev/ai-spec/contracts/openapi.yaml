# openapi.yaml — SuperSonic API 契约（骨架）
# 完整 API 详见各模块 Controller 定义

openapi: 3.0.3
info:
  title: SuperSonic API
  version: 1.0.0
  description: SuperSonic 数据分析平台 API 契约

servers:
  - url: /api/semantic
    description: 语义层 API（headless）
  - url: /api/auth
    description: 认证授权 API（auth）
  - url: /api/chat
    description: 对话层 API（chat）

paths:
  # --- 语义层 ---
  /model:
    post:
      summary: 创建数据模型
      tags: [Model]
    get:
      summary: 查询模型列表
      tags: [Model]

  /model/{id}:
    get:
      summary: 获取模型详情
      tags: [Model]
    put:
      summary: 更新模型
      tags: [Model]
    delete:
      summary: 删除模型
      tags: [Model]

  /dimension:
    post:
      summary: 创建维度
      tags: [Dimension]
    get:
      summary: 查询维度列表
      tags: [Dimension]

  /metric:
    post:
      summary: 创建指标
      tags: [Metric]
    get:
      summary: 查询指标列表
      tags: [Metric]

  /dataSet:
    post:
      summary: 创建数据集
      tags: [DataSet]
    get:
      summary: 查询数据集列表
      tags: [DataSet]

  # --- 对话层 ---
  /chat/manage/gpts:
    post:
      summary: 创建 Agent
      tags: [Agent]
    get:
      summary: 查询 Agent 列表
      tags: [Agent]

  # --- LLM 用量（管理员）---
  /admin/llm-usage:
    get:
      summary: 查询 LLM 用量明细（平台管理员或租户管理员）
      tags: [LlmUsage]
      parameters:
        - name: tenantId
          in: query
          schema: { type: integer }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: callType
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }

  /admin/llm-usage/daily-aggregates:
    get:
      summary: 查询按天聚合的 LLM 用量（按 tenantId+callType 分组）
      tags: [LlmUsage]
      parameters:
        - name: tenantId
          in: query
          schema: { type: integer }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }

  /admin/llm-usage/total-tokens:
    get:
      summary: 查询指定时间范围内的 token 总量
      tags: [LlmUsage]
      parameters:
        - name: tenantId
          in: query
          schema: { type: integer }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }

  # --- 认证层 ---
  /user/login:
    post:
      summary: 用户登录
      tags: [Auth]

  /role:
    post:
      summary: 创建角色
      tags: [Role]
    get:
      summary: 查询角色列表
      tags: [Role]

servers:
  - url: /api/v1
    description: 平台管理 API（v1）

paths_v1:
  # --- 租户配额（管理员）---
  /admin/tenant-quotas:
    get:
      summary: 查询全部租户配额配置（平台管理员）
      tags: [TenantQuota]

  /admin/tenant-quotas/{tenantId}:
    get:
      summary: 查询指定租户配额
      tags: [TenantQuota]
    put:
      summary: 创建或更新租户配额（upsert）
      tags: [TenantQuota]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [jdbcConcurrent, enabled]
              properties:
                jdbcConcurrent: { type: integer, minimum: 1 }
                llmConcurrent: { type: integer, minimum: 1 }
                acquireTimeoutMs: { type: integer, minimum: 1 }
                monthlyQueryCount: { type: integer, minimum: 0 }
                enabled: { type: boolean }
    delete:
      summary: 删除租户配额配置（恢复全局默认）
      tags: [TenantQuota]
